 <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Painel de Resultados</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 100%;
    padding: 10px;
}

.header {
    text-align: center;
    margin-bottom: 12px;
}

.header h1 {
    margin: 0;
    font-size: 25px;
    font-weight: 900;
}

.subtitulo {
    color: #aaa;
    font-size: 12px;
    margin-top: 3px;
}

.aviso {
    display: inline-block;
    margin-top: 7px;
    padding: 5px 10px;
    border-radius: 15px;
    background: #332b00;
    color: #ffd83d;
    font-size: 10px;
    font-weight: bold;
}

.card {
    background: #181818;
    border-radius: 15px;
    padding: 13px;
    margin-bottom: 10px;
    border-left: 5px solid var(--cor);
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.identidade {
    display: flex;
    align-items: center;
    gap: 8px;
}

.posicao {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #303030;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
}

.nome {
    font-size: 18px;
    font-weight: 900;
}

.votos {
    font-size: 27px;
    font-weight: 900;
}

.barra-fundo {
    width: 100%;
    height: 23px;
    margin-top: 10px;
    background: #383838;
    border-radius: 20px;
    overflow: hidden;
}

.barra {
    height: 100%;
    background: var(--cor);
    border-radius: 20px;
    transition: width .35s ease;
}

.info {
    display: flex;
    justify-content: space-between;
    color: #aaa;
    font-size: 12px;
    margin-top: 5px;
}

.controles {
    display: flex;
    gap: 8px;
    margin-top: 9px;
}

button {
    border: 0;
    color: white;
    font-size: 22px;
    font-weight: 900;
    border-radius: 9px;
    width: 48px;
    height: 38px;
}

.menos {
    background: #a52323;
}

.mais {
    background: #168b45;
}

.zerar {
    display: block;
    margin: 15px auto 5px;
    width: 150px;
    height: 38px;
    background: #444;
    font-size: 14px;
}

button:active {
    transform: scale(.94);
}

.rodape {
    text-align: center;
    color: #555;
    font-size: 9px;
    margin-top: 8px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>📊 PAINEL DE RESULTADOS</h1>

        <div class="subtitulo">
            Acompanhamento da simulação
        </div>

        <div class="aviso">
            SIMULAÇÃO / RESULTADOS FICTÍCIOS
        </div>

    </div>

    <div id="painel"></div>

    <button class="zerar" onclick="zerarTudo()">
        ZERAR TUDO
    </button>

    <div class="rodape">
        Painel demonstrativo
    </div>

</div>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>


<script>

const firebaseConfig = {

    apiKey: "AIzaSyAhDw8PgOsrxeaDzzPqO_OqlTa9aw8fdk8",

    authDomain: "painel-livre.firebaseapp.com",

    databaseURL:
    "https://painel-livre-default-rtdb.firebaseio.com",

    projectId: "painel-livre",

    storageBucket:
    "painel-livre.firebasestorage.app",

    messagingSenderId:
    "997775064382",

    appId:
    "1:997775064382:web:bcb4fd836efbf963a2406f"

};


firebase.initializeApp(firebaseConfig);


const banco =
firebase.database();


const resultadosRef =
banco.ref("resultados");


const candidatos = {

    lula: {
        nome: "Lula",
        cor: "#e53935"
    },

    flavio: {
        nome: "Flávio Bolsonaro",
        cor: "#ffffff"
    },

    renan: {
        nome: "Renan Santos",
        cor: "#ff8a00"
    },

    marcal: {
        nome: "Pablo Marçal",
        cor: "#1687d9"
    }

};


let resultados = {

    lula: 0,
    flavio: 0,
    renan: 0,
    marcal: 0

};


resultadosRef.on("value", function(snapshot) {

    if (snapshot.exists()) {

        resultados =
        snapshot.val();

    }

    mostrar();

});


function alterar(id, quantidade) {

    let novoValor =
        Number(resultados[id] || 0)
        + quantidade;


    if (novoValor < 0) {

        novoValor = 0;

    }


    resultados[id] =
        novoValor;


    resultadosRef.set(
        resultados
    );

}


function zerarTudo() {

    if (
        !confirm(
            "Tem certeza que deseja zerar todos os resultados?"
        )
    ) {

        return;

    }


    resultadosRef.set({

        lula: 0,

        flavio: 0,

        renan: 0,

        marcal: 0

    });

}


function mostrar() {

    let lista = [];


    for (
        let id in candidatos
    ) {

        lista.push({

            id: id,

            nome:
            candidatos[id].nome,

            cor:
            candidatos[id].cor,

            votos:
            Number(
                resultados[id] || 0
            )

        });

    }


    lista.sort(
        function(a, b) {

            return b.votos - a.votos;

        }
    );


    let total = 0;


    lista.forEach(
        function(candidato) {

            total +=
            candidato.votos;

        }
    );


    let html = "";


    lista.forEach(
        function(candidato, index) {

            let porcentagem =
            total > 0

            ? (
                candidato.votos /
                total
            ) * 100

            : 0;


            html += `

            <div
                class="card"
                style="--cor:${candidato.cor}"
            >

                <div class="topo">

                    <div class="identidade">

                        <div class="posicao">

                            ${index + 1}º

                        </div>

                        <div class="nome">

                            ${candidato.nome}

                        </div>

                    </div>


                    <div class="votos">

                        ${candidato.votos
                        .toLocaleString("pt-BR")}

                    </div>

                </div>


                <div class="barra-fundo">

                    <div
                        class="barra"
                        style="
                        width:${porcentagem}%;
                        "
                    ></div>

                </div>


                <div class="info">

                    <span>
                        Participação
                    </span>

                    <span>

                        ${porcentagem
                        .toFixed(1)}%

                    </span>

                </div>


                <div class="controles">

                    <button
                        class="menos"
                        onclick="
                        alterar(
                            '${candidato.id}',
                            -1
                        )"
                    >

                        −

                    </button>


                    <button
                        class="mais"
                        onclick="
                        alterar(
                            '${candidato.id}',
                            1
                        )"
                    >

                        +

                    </button>

                </div>

            </div>

            `;

        }
    );


    document.getElementById(
        "painel"
    ).innerHTML = html;

}

</script>

</body>
</html>
