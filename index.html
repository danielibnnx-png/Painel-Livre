<title>Painel de Simulação</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    background: #080808;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 100%;
    padding: 10px 10px 18px;
}

.header {
    text-align: center;
    margin-bottom: 12px;
}

.header h1 {
    margin: 0;
    font-size: 25px;
    font-weight: 900;
    line-height: 1.1;
}

.subtitulo {
    margin-top: 3px;
    color: #aaa;
    font-size: 12px;
}

.aviso {
    display: inline-block;
    margin-top: 7px;
    padding: 5px 10px;
    border-radius: 15px;
    background: #332b00;
    color: #ffd83d;
    font-size: 10px;
    font-weight: bold;
}

.card {
    width: 100%;
    background: #181818;
    border-radius: 14px;
    padding: 13px;
    margin-bottom: 10px;
    border-left: 5px solid var(--cor);
    box-shadow: 0 3px 12px rgba(0,0,0,.45);
}

.topo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
}

.identidade {
    display: flex;
    align-items: center;
    min-width: 0;
    gap: 8px;
}

.posicao {
    flex: 0 0 34px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #303030;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 900;
}

.nome {
    font-size: 18px;
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.votos {
    flex-shrink: 0;
    font-size: 27px;
    font-weight: 900;
}

.barra-fundo {
    width: 100%;
    height: 24px;
    margin-top: 10px;
    background: #383838;
    border-radius: 20px;
    overflow: hidden;
}

.barra {
    height: 100%;
    min-width: 0;
    background: var(--cor);
    border-radius: 20px;
    transition: width .35s ease;
}

.info {
    display: flex;
    justify-content: space-between;
    margin-top: 5px;
    color: #aaa;
    font-size: 12px;
}

.rodape {
    text-align: center;
    margin-top: 8px;
    color: #555;
    font-size: 9px;
}

@media (max-width: 380px) {

    .container {
        padding: 8px 8px 14px;
    }

    .header h1 {
        font-size: 22px;
    }

    .card {
        padding: 11px;
        margin-bottom: 8px;
    }

    .nome {
        font-size: 16px;
    }

    .votos {
        font-size: 24px;
    }

    .barra-fundo {
        height: 21px;
    }
}
</style>
</head>
