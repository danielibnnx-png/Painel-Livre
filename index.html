<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel de Simulação</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 94%;
    max-width: 760px;
    margin: auto;
    padding: 18px 0 30px;
}

.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0;
    font-size: 29px;
    font-weight: 900;
}

.subtitulo {
    color: #aaa;
    margin-top: 5px;
    font-size: 13px;
}

.aviso {
    display: inline-block;
    margin-top: 10px;
    padding: 6px 12px;
    border-radius: 20px;
    background: #332b00;
    color: #ffd83d;
    font-size: 11px;
    font-weight: bold;
}

.card {
    background: #191919;
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 14px;

    border-left: 6px solid var(--cor);

    box-shadow:
        0 5px 18px rgba(0,0,0,.45);
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.identidade {
    display: flex;
    align-items: center;
    gap: 10px;
}

.posicao {
    width: 38px;
    height: 38px;

    border-radius: 50%;

    background: #303030;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;
    font-size: 17px;
}

.nome {
    font-size: 19px;
    font-weight: 800;
}

.votos {
    font-size: 28px;
    font-weight: 900;
}

.barra-fundo {
    width: 100%;
    height: 20px;

    margin-top: 13px;

    background: #373737;

    border-radius: 20px;

    overflow: hidden;
}

.barra {
    height: 100%;
    width: 0%;

    background: var(--cor);

    border-radius: 20px;

    transition: width .35s ease;
}
