<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Simulação</title>

<style>
body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 20px 0 5px;
  font-size: 28px;
}

.aviso {
  color: #ffd54a;
  font-size: 13px;
  margin-bottom: 20px;
}

.painel {
  max-width: 600px;
  margin: auto;
  padding: 10px;
}

.candidato {
  background: #222;
  border-radius: 15px;
  padding: 15px;
  margin-bottom: 15px;
}

.nome {
  font-size: 22px;
  font-weight: bold;
}

.votos {
  font-size: 35px;
  margin: 10px;
}

button {
  font-size: 25px;
  width: 60px;
  height: 50px;
  margin: 5px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.mais {
  background: #18c964;
  color: white;
}

.menos {
  background: #e53935;
  color: white;
}
</style>
</head>

<body>

<h1>PAINEL DE RESULTADOS</h1>

<div class="aviso">
SIMULAÇÃO / RESULTADOS FICTÍCIOS
</div>

<div class="painel">

  <div class="candidato">
    <div class="nome">Lula</div>
    <div class="votos" id="lula">0</div>
    <button class="menos" onclick="alterar('lula', -1)">−</button>
    <button class="mais" onclick="alterar('lula', 1)">+</button>
  </div>

  <div class="candidato">
    <div class="nome">Flávio Bolsonaro</div>
    <div class="votos" id="flavio">0</div>
    <button class="menos" onclick="alterar('flavio', -1)">−</button>
    <button class="mais" onclick="alterar('flavio', 1)">+</button>
  </div>

  <div class="candidato">
    <div class="nome">Renan Santos</div>
    <div class="votos" id="renan">0</div>
    <button class="menos" onclick="alterar('renan', -1)">−</button>
    <button class="mais" onclick="alterar('renan', 1)">+</button>
  </div>

  <div class="candidato">
    <div class="nome">Pablo Marçal</div>
    <div class="votos" id="marcal">0</div>
    <button class="menos" onclick="alterar('marcal', -1)">−</button>
    <button class="mais" onclick="alterar('marcal', 1)">+</button>
  </div>

</div>

<script>

let resultados = {
  lula: 0,
  flavio: 0,
  renan: 0,
  marcal: 0
};

function alterar(nome, valor) {

  resultados[nome] += valor;

  if (resultados[nome] < 0) {
    resultados[nome] = 0;
  }

  document.getElementById(nome).innerText =
    resultados[nome].toLocaleString('pt-BR');
}

</script>

</body>
</html>
