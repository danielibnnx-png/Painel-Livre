<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel de Resultados</title>

<style>

body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 94%;
    max-width: 700px;
    margin: auto;
    padding: 20px 0;
}

h1 {
    text-align: center;
    font-size: 28px;
    margin: 5px 0;
}

.aviso {
    text-align: center;
    color: #ffd54a;
    font-size: 12px;
    margin: 10px 0 20px;
}

.candidato {
    background: #222;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 14px;
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.nome {
    font-size: 20px;
    font-weight: bold;
}

.numero {
    font-size: 27px;
    font-weight: bold;
}

.barra-fundo {
    height: 18px;
    background: #444;
    border-radius: 20px;
    margin-top: 12px;
    overflow: hidden;
}

.barra {
    height: 100%;
    border-radius: 20px;
}

.porcentagem {
    margin-top: 6px;
    font-size: 14px;
    color: #bbb;
}

</style>
</head>

<body>

<div class="container">

<h1>📊 PAINEL DE RESULTADOS</h1>

<div class="aviso">
SIMULAÇÃO / RESULTADOS FICTÍCIOS
</div>

<div id="painel"></div>

</div>

<script>

var resultados = {
    lula: 0,
    flavio: 0,
    renan: 0,
    marcal: 0
};

var candidatos = [
    {
        id: "lula",
        nome: "Lula",
        cor: "#159447"
    },
    {
        id: "flavio",
        nome: "Flávio Bolsonaro",
        cor: "#1687d9"
    },
    {
        id: "renan",
        nome: "Renan Santos",
        cor: "#ff8a00"
    },
    {
        id: "marcal",
        nome: "Pablo Marçal",
        cor: "#9b59ff"
    }
];

function mostrarPainel() {

    var lista = candidatos.slice();

    lista.sort(function(a, b) {
        return resultados[b.id] - resultados[a.id];
    });

    var total = 0;

    for (var i = 0; i < lista.length; i++) {
        total += resultados[lista[i].id];
    }

    var html = "";

    for (var i = 0; i < lista.length; i++) {

        var pessoa = lista[i];

        var votos = resultados[pessoa.id];

        var porcentagem = 0;

        if (total > 0) {
            porcentagem = (votos / total) * 100;
        }

        html +=
        '<div class="candidato">' +

            '<div class="topo">' +

                '<div class="nome">' +
                    (i + 1) +
                    'º — ' +
                    pessoa.nome +
                '</div>' +

                '<div class="numero">' +
                    votos.toLocaleString("pt-BR") +
                '</div>' +

            '</div>' +

            '<div class="barra-fundo">' +

                '<div class="barra" ' +
                'style="width:' +
                porcentagem +
                '%;background:' +
                pessoa.cor +
                ';">' +

                '</div>' +

            '</div>' +

            '<div class="porcentagem">' +
                porcentagem.toFixed(1) +
                '%' +
            '</div>' +

        '</div>';
    }

    document.getElementById("painel").innerHTML = html;
}

mostrarPainel();

</script>

</body>
</html>
