<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Simulação</title>

<style>
body {
    margin: 0;
    background: #0b0b0b;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 94%;
    max-width: 700px;
    margin: auto;
    padding: 18px 0;
}

h1 {
    text-align: center;
    margin: 5px 0;
    font-size: 28px;
}

.aviso {
    text-align: center;
    color: #ffd54a;
    font-size: 12px;
    margin: 8px 0 20px;
}

.candidato {
    background: #1d1d1d;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 15px;
    border-left: 5px solid var(--cor);
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.nome {
    font-size: 20px;
    font-weight: bold;
}

.numero {
    font-size: 28px;
    font-weight: bold;
}

.barra-fundo {
    height: 20px;
    background: #3a3a3a;
    border-radius: 20px;
    margin-top: 12px;
    overflow: hidden;
}

.barra {
    height: 100%;
    width: 0%;
    background: var(--cor);
    border-radius: 20px;
    transition: width .3s;
}

.porcentagem {
    margin-top: 6px;
    font-size: 14px;
    color: #bbb;
}

.botoes {
    margin-top: 12px;
}

button {
    width: 55px;
    height: 42px;
    border: none;
    border-radius: 9px;
    font-size: 24px;
    font-weight: bold;
    color: white;
    margin-right: 7px;
}

.menos {
    background: #d62828;
}

.mais {
    background: #159447;
}

</style>
</head>

<body>

<div class="container">

<h1>📊 PAINEL DE RESULTADOS</h1>

<div class="aviso">
SIMULAÇÃO / RESULTADOS FICTÍCIOS
</div>

<div id="painel"></div>

</div>

<script>

var candidatos = [
    {
        id: "lula",
        nome: "Lula",
        cor: "#159447",
        votos: 0
    },
    {
        id: "flavio",
        nome: "Flávio Bolsonaro",
        cor: "#1687d9",
        votos: 0
    },
    {
        id: "renan",
        nome: "Renan Santos",
        cor: "#ff8a00",
        votos: 0
    },
    {
        id: "marcal",
        nome: "Pablo Marçal",
        cor: "#9b59ff",
        votos: 0
    }
];

function alterar(indice, valor) {

    candidatos[indice].votos += valor;

    if (candidatos[indice].votos < 0) {
        candidatos[indice].votos = 0;
    }

    mostrar();
}

function mostrar() {

    var lista = candidatos.slice();

    lista.sort(function(a, b) {
        return b.votos - a.votos;
    });

    var total = 0;

    for (var i = 0; i < lista.length; i++) {
        total += lista[i].votos;
    }

    var html = "";

    for (var i = 0; i < lista.length; i++) {

        var pessoa = lista[i];

        var porcentagem = total > 0
            ? (pessoa.votos / total) * 100
            : 0;

        var indiceOriginal =
            candidatos.indexOf(pessoa);

        html += `
        <div
            class="candidato"
            style="--cor:${pessoa.cor}"
        >

            <div class="topo">

                <div class="nome">
                    ${i + 1}º — ${pessoa.nome}
                </div>

                <div class="numero">
                    ${pessoa.votos.toLocaleString("pt-BR")}
                </div>

            </div>

            <div class="barra-fundo">

                <div
                    class="barra"
                    style="width:${porcentagem}%"
                ></div>

            </div>

            <div class="porcentagem">
                ${porcentagem.toFixed(1)}%
            </div>

            <div class="botoes">

                <button
                    class="menos"
                    onclick="alterar(${indiceOriginal}, -1)"
                >
                    −
                </button>

                <button
                    class="mais"
                    onclick="alterar(${indiceOriginal}, 1)"
                >
                    +
                </button>

            </div>

        </div>
        `;
    }

    document.getElementById("painel").innerHTML = html;
}

mostrar();

</script>

</body>
</html>
