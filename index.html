 <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel de Resultados</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    width: 94%;
    max-width: 760px;
    margin: auto;
    padding: 18px 0 30px;
}

.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0;
    font-size: 29px;
    font-weight: 900;
}

.subtitulo {
    color: #aaa;
    margin-top: 5px;
    font-size: 13px;
}

.aviso {
    display: inline-block;
    margin-top: 10px;
    padding: 6px 12px;
    border-radius: 20px;
    background: #332b00;
    color: #ffd83d;
    font-size: 11px;
    font-weight: bold;
}

.card {
    background: #191919;
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 14px;
    border-left: 6px solid var(--cor);
    box-shadow: 0 5px 18px rgba(0,0,0,.45);
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.identidade {
    display: flex;
    align-items: center;
    gap: 10px;
}

.posicao {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #303030;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 17px;
}

.nome {
    font-size: 19px;
    font-weight: 800;
}

.votos {
    font-size: 28px;
    font-weight: 900;
}

.barra-fundo {
    width: 100%;
    height: 20px;
    margin-top: 13px;
    background: #373737;
    border-radius: 20px;
    overflow: hidden;
}

.barra {
    height: 100%;
    background: var(--cor);
    border-radius: 20px;
    transition: width .35s ease;
}

.info {
    display: flex;
    justify-content: space-between;
    margin-top: 7px;
    color: #aaa;
    font-size: 13px;
}

.rodape {
    text-align: center;
    margin-top: 18px;
    color: #666;
    font-size: 11px;
}

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>📊 PAINEL DE RESULTADOS</h1>

        <div class="subtitulo">
            Acompanhamento da simulação
        </div>

        <div class="aviso">
            SIMULAÇÃO / RESULTADOS FICTÍCIOS
        </div>

    </div>

    <div id="painel"></div>

    <div class="rodape">
        Painel demonstrativo
    </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>


<script>

const firebaseConfig = {

    apiKey: "AIzaSyAhDw8PgOsrxeaDzzPqO_OqlTa9aw8fdk8",

    authDomain: "painel-livre.firebaseapp.com",

    databaseURL:
    "https://painel-livre-default-rtdb.firebaseio.com",

    projectId: "painel-livre",

    storageBucket:
    "painel-livre.firebasestorage.app",

    messagingSenderId:
    "997775064382",

    appId:
    "1:997775064382:web:bcb4fd836efbf963a2406f"

};


firebase.initializeApp(firebaseConfig);


const banco =
firebase.database();


const resultadosRef =
banco.ref("resultados");


const candidatos = {

    lula: {
        nome: "Lula",
        cor: "#e53935"
    },

    flavio: {
        nome: "Flávio Bolsonaro",
        cor: "#18a957"
    },

    renan: {
        nome: "Renan Santos",
        cor: "#ff8a00"
    },

    marcal: {
        nome: "Pablo Marçal",
        cor: "#1687d9"
    }

};


resultadosRef.on(
    "value",
    function(snapshot) {

        let resultados =
        snapshot.val() || {

            lula: 0,

            flavio: 0,

            renan: 0,

            marcal: 0

        };


        mostrar(resultados);

    }
);


function mostrar(resultados) {

    let lista = [];


    for (let id in candidatos) {

        lista.push({

            id: id,

            nome:
            candidatos[id].nome,

            cor:
            candidatos[id].cor,

            votos:
            Number(resultados[id] || 0)

        });

    }


    lista.sort(
        function(a,b) {

            return b.votos - a.votos;

        }
    );


    let total = 0;


    lista.forEach(
        function(candidato) {

            total += candidato.votos;

        }
    );


    let html = "";


    lista.forEach(
        function(candidato, index) {


            let porcentagem =
            total > 0

            ? candidato.votos /
              total * 100

            : 0;


            html += `

            <div
                class="card"
                style="--cor:${candidato.cor}"
            >

                <div class="topo">

                    <div class="identidade">

                        <div class="posicao">

                            ${index + 1}º

                        </div>

                        <div class="nome">

                            ${candidato.nome}

                        </div>

                    </div>


                    <div class="votos">

                        ${candidato.votos
                        .toLocaleString("pt-BR")}

                    </div>

                </div>


                <div class="barra-fundo">

                    <div
                        class="barra"
                        style="
                        width:${porcentagem}%;
                        "
                    ></div>

                </div>


                <div class="info">

                    <span>
                        Participação
                    </span>

                    <span>

                        ${porcentagem
                        .toFixed(1)}%

                    </span>

                </div>

            </div>

            `;

        }
    );


    document.getElementById(
        "painel"
    ).innerHTML = html;

}

</script>

</body>
</html>
