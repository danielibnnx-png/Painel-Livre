<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle do Painel</title>

<style>
body {
    margin: 0;
    padding: 20px;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.aviso {
    text-align: center;
    color: #ffd54a;
    font-size: 13px;
    margin-bottom: 25px;
}

.candidato {
    background: #222;
    border-radius: 15px;
    padding: 18px;
    margin: 15px auto;
    max-width: 500px;
}

.nome {
    font-size: 22px;
    font-weight: bold;
}

.votos {
    font-size: 32px;
    margin: 10px 0;
}

button {
    width: 65px;
    height: 50px;
    font-size: 28px;
    border: none;
    border-radius: 10px;
    margin-right: 8px;
}

.mais {
    background: #18c964;
    color: white;
}

.menos {
    background: #e53935;
    color: white;
}

#zerar {
    display: block;
    width: 180px;
    margin: 30px auto;
    background: #555;
    color: white;
    font-size: 17px;
}
</style>
</head>

<body>

<h1>CONTROLE DO PAINEL</h1>

<div class="aviso">
SIMULAÇÃO / RESULTADOS FICTÍCIOS
</div>

<div id="painel"></div>

<button id="zerar" onclick="zerar()">ZERAR TUDO</button>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyAhDw8PgOsrxeaDzzPqO_OqlTa9aw8fdk8",
    authDomain: "painel-livre.firebaseapp.com",
    databaseURL: "https://painel-livre-default-rtdb.firebaseio.com",
    projectId: "painel-livre",
    storageBucket: "painel-livre.firebasestorage.app",
    messagingSenderId: "997775064382",
    appId: "1:997775064382:web:bcb4fd836efbf963a2406f"
};

firebase.initializeApp(firebaseConfig);

const banco = firebase.database();

const resultadosRef = banco.ref("resultados");

const nomes = {
    lula: "Lula",
    flavio: "Flávio Bolsonaro",
    renan: "Renan Santos",
    marcal: "Pablo Marçal"
};

let resultados = {
    lula: 0,
    flavio: 0,
    renan: 0,
    marcal: 0
};


/* Recebe os dados do Firebase */

resultadosRef.on("value", function(snapshot) {

    if (snapshot.exists()) {
        resultados = snapshot.val();
    }

    mostrar();

});


/* Mostra os candidatos */

function mostrar() {

    let html = "";

    for (let nome in nomes) {

        let votos = Number(resultados[nome] || 0);

        html += `
        <div class="candidato">

            <div class="nome">
                ${nomes[nome]}
            </div>

            <div class="votos">
                ${votos.toLocaleString("pt-BR")}
            </div>

            <button
                class="menos"
                onclick="alterar('${nome}', -1)">
                −
            </button>

            <button
                class="mais"
                onclick="alterar('${nome}', 1)">
                +
            </button>

        </div>
        `;
    }

    document.getElementById("painel").innerHTML = html;
}


/* Altera os votos */

function alterar(nome, valor) {

    let novoValor =
        Number(resultados[nome] || 0) + valor;

    if (novoValor < 0) {
        novoValor = 0;
    }

    resultados[nome] = novoValor;

    resultadosRef.set(resultados);
}


/* Zera tudo */

function zerar() {

    if (!confirm("Tem certeza que deseja zerar tudo?")) {
        return;
    }

    resultadosRef.set({
        lula: 0,
        flavio: 0,
        renan: 0,
        marcal: 0
    });

}

</script>

</body>
</html>
